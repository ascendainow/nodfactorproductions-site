<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page no longer available | Nod Factor Productions</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1020;
    --bg-2:#0f1428;
    --panel:#111731;
    --gold:#d4af37;
    --gold-bright:#f4c542;
    --text:#f3f1e9;
    --muted:#9aa0b5;
    --line:rgba(212,175,55,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Montserrat',Arial,sans-serif;font-weight:300;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;
  }
  .box{max-width:560px}
  .eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  h1{font-family:'Cinzel',serif;font-size:clamp(26px,5vw,40px);line-height:1.15;color:var(--gold-bright);font-weight:700}
  .rule{height:2px;width:120px;margin:20px auto 24px;background:linear-gradient(90deg,rgba(212,175,55,0),var(--gold),rgba(212,175,55,0))}
  p{color:var(--muted);font-size:16px;margin-bottom:12px}
  .cta{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:13px 26px;border-radius:999px;text-decoration:none;
    font-family:'Montserrat',Arial,sans-serif;font-weight:600;font-size:13px;
    letter-spacing:2px;text-transform:uppercase;transition:all .18s ease;
  }
  .btn-primary{background:var(--gold);color:#0c1020;border:1px solid var(--gold)}
  .btn-primary:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
  .btn-ghost{background:transparent;color:var(--gold-bright);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--gold-bright)}
  footer{position:fixed;left:0;right:0;bottom:0;padding:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">Nod Factor Productions &amp; Media</div>
    <h1>This Page Is No Longer Available</h1>
    <div class="rule"></div>
    <p>The page you were looking for has been retired and has no replacement.</p>
    <p>Everything current lives on the main site.</p>
    <div class="cta">
      <a class="btn btn-primary" href="/">Go To Home</a>
      <a class="btn btn-ghost" href="/about">About Nod Factor</a>
    </div>
  </div>
  <footer>&copy; 2026 Nod Factor Productions &amp; Media &middot; Birmingham, AL</footer>
</body>
</html>
